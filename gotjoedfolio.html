<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GOTJOEDfolio — PDF editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Caveat:wght@600&family=Dancing+Script:wght@600&family=Homemade+Apple&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
:root{
  --ink:#1B2330; --ink-2:#4A5566; --ink-3:#7A8494;
  --chrome:#FFFFFF; --panel:#F4F5F7; --canvas:#D8DBE1; --line:#D9DCE2; --hover:#ECEEF2;
  --accent:#2E4BD6; --accent-ink:#FFFFFF; --accent-soft:#E6EAFB;
  --marker:#F2B01E; --danger:#C62E2E; --ok:#1E8A4C;
  --paper-shadow:0 1px 2px rgba(20,30,50,.18),0 6px 18px rgba(20,30,50,.10);
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#E7EAF0; --ink-2:#B3BAC6; --ink-3:#8790A0;
  --chrome:#1E232C; --panel:#252B35; --canvas:#12161C; --line:#343B47; --hover:#2E3541;
  --accent:#7D93FF; --accent-ink:#0E1326; --accent-soft:#2A3358;
}}
:root[data-theme="dark"]{
  --ink:#E7EAF0; --ink-2:#B3BAC6; --ink-3:#8790A0;
  --chrome:#1E232C; --panel:#252B35; --canvas:#12161C; --line:#343B47; --hover:#2E3541;
  --accent:#7D93FF; --accent-ink:#0E1326; --accent-soft:#2A3358;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;font-family:var(--font);font-size:14px;color:var(--ink);background:var(--chrome);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-rows:auto auto 1fr;height:100%}
/* Top bar */
.top{display:flex;align-items:center;gap:6px;height:48px;padding:0 10px;border-bottom:1px solid var(--line);background:var(--chrome);position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;padding-right:8px;white-space:nowrap}
.brand b{font-weight:500;color:var(--ink-3);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.menus{display:flex;gap:2px}
.menus>button,.tb{background:none;border:0;padding:6px 10px;border-radius:6px}
.menus>button:hover,.tb:hover,.menus>button[aria-expanded="true"]{background:var(--hover)}
.doc-title{flex:1;display:flex;justify-content:center;min-width:0}
.doc-title input{border:1px solid transparent;background:none;text-align:center;font-weight:600;padding:5px 8px;border-radius:6px;max-width:360px;width:100%;text-overflow:ellipsis}
.doc-title input:hover{border-color:var(--line)}
.top-actions{display:flex;align-items:center;gap:4px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--chrome);padding:6px 12px;border-radius:18px;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border:0;background:none;border-radius:8px;color:var(--ink-2)}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.icon-btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.dropdown{position:absolute;top:44px;min-width:250px;background:var(--chrome);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;z-index:60}
.dropdown button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;padding:7px 10px;border-radius:6px;text-align:left}
.dropdown button:hover{background:var(--hover)}
.dropdown button kbd{margin-left:auto;color:var(--ink-3);font:12px var(--font)}
.dropdown hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
/* Options bar */
.optbar{display:flex;align-items:center;gap:6px;min-height:42px;padding:4px 10px;border-bottom:1px solid var(--line);background:var(--chrome);overflow-x:auto;scrollbar-width:thin}
.optbar>*{flex:none;white-space:nowrap}.optbar .hint{margin:0}
.optbar .sep{width:1px;height:22px;background:var(--line);margin:0 4px;flex:none}
.optbar label{display:flex;align-items:center;gap:5px;color:var(--ink-2);font-size:13px;white-space:nowrap}
.optbar select,.optbar input[type=number],.field select,.field input,.field textarea{border:1px solid var(--line);background:var(--chrome);border-radius:6px;padding:4px 6px}
.optbar input[type=color]{width:28px;height:24px;border:1px solid var(--line);border-radius:6px;padding:0;background:none}
.optbar .ctx-title{font-weight:600;margin-right:6px;white-space:nowrap}
/* Main grid */
.main{display:grid;grid-template-columns:52px auto 1fr auto 48px;min-height:0;position:relative}
.main>#quickRail{grid-column:1;grid-row:1}.main>#toolsPane{grid-column:2;grid-row:1}.main>.viewer-wrap{grid-column:3;grid-row:1}.main>#sidePane{grid-column:4;grid-row:1}.main>#sideRail{grid-column:5;grid-row:1}
.pane-body input:not([type=checkbox]):not([type=radio]):not([type=color]),.pane-body textarea,.pane-body select,.modal input:not([type=checkbox]):not([type=radio]):not([type=color]),.modal textarea,.modal select{background:var(--chrome);color:var(--ink);border:1px solid var(--line);border-radius:6px}
.rail{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;background:var(--chrome);border-right:1px solid var(--line);overflow-y:auto}
.rail.right{border-right:0;border-left:1px solid var(--line)}
.rail .icon-btn{width:38px;height:38px}
.rail hr{width:24px;border:0;border-top:1px solid var(--line);margin:4px 0}
.tools-pane{width:288px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tools-pane[hidden],.side-pane[hidden]{display:none}
.pane-head{display:flex;align-items:center;gap:6px;padding:12px 12px 8px;font-weight:700;font-size:15px}
.pane-head .icon-btn{width:28px;height:28px}
.pane-body{overflow-y:auto;padding:0 12px 16px;flex:1}
.tool-list{display:flex;flex-direction:column;gap:1px}
.tool-item{display:flex;align-items:center;gap:12px;border:0;background:none;padding:8px 8px;border-radius:8px;text-align:left;width:100%}
.tool-item:hover{background:var(--hover)}
.tool-item .ti{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--chrome);border:1px solid var(--line);color:var(--accent)}
.tool-item small{display:block;color:var(--ink-3);font-size:12px}
.group-label{font-size:12px;color:var(--ink-3);font-weight:600;margin:14px 8px 4px}
.acts{display:flex;flex-direction:column;gap:6px}
.act{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--chrome);padding:9px 10px;border-radius:8px;text-align:left;width:100%}
.act:hover{border-color:var(--accent)}
.act.on{border-color:var(--accent);background:var(--accent-soft)}
.act svg{color:var(--accent)}
.field{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.field>span{font-size:12px;color:var(--ink-2);font-weight:600}
.field input,.field select,.field textarea{width:100%;padding:6px 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hint{color:var(--ink-3);font-size:12.5px;line-height:1.45;margin:6px 0}
.check{display:flex;align-items:center;gap:8px;margin:6px 0}
/* Viewer */
.viewer-wrap{position:relative;min-width:0;min-height:0;background:var(--canvas)}
.viewer{position:absolute;inset:0;overflow:auto;padding:24px 24px 90px}
.pages{display:flex;flex-direction:column;align-items:center;gap:18px}
.page{position:relative;background:#fff;box-shadow:var(--paper-shadow);flex:none}
.page canvas{position:absolute;inset:0;width:100%;height:100%}
.page .ov{position:absolute;inset:0}
.page .pnum{position:absolute;left:-2px;top:-17px;font-size:11px;color:var(--ink-3)}
.viewer.two .pages{flex-direction:row;flex-wrap:wrap;justify-content:center}
.float-nav{position:absolute;right:18px;bottom:18px;display:flex;align-items:center;gap:2px;background:var(--chrome);border:1px solid var(--line);border-radius:22px;padding:4px 6px;box-shadow:0 6px 20px rgba(0,0,0,.14)}
.float-nav input{width:38px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:3px;background:var(--chrome)}
.float-nav .icon-btn{width:30px;height:30px}
.float-nav .zv{min-width:48px;text-align:center;font-size:13px;border:0;background:none;padding:4px;border-radius:6px}
/* Overlay objects */
.an{position:absolute;box-sizing:border-box}
.ov.tool-select .an{cursor:move}
.an.sel{outline:1.5px solid var(--accent);outline-offset:1px}
.an .grip{position:absolute;right:-5px;bottom:-5px;width:10px;height:10px;background:var(--accent);border:2px solid #fff;border-radius:2px;cursor:nwse-resize;display:none}
.an.sel .grip{display:block}
.an.txt{white-space:pre-wrap;line-height:1.2;outline-color:var(--accent);min-width:10px}
.an.txt[contenteditable="true"]{cursor:text;outline:1.5px dashed var(--accent)}
.an.hl{mix-blend-mode:multiply}
.an.note{width:22px;height:22px;border-radius:4px 4px 4px 0;display:grid;place-items:center;color:#1B2330;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.an.redact{background:repeating-linear-gradient(45deg,rgba(198,46,46,.25) 0 6px,rgba(198,46,46,.12) 6px 12px);border:1.5px solid var(--danger)}
.an.field{border:1.5px solid #3D7BF0;background:rgba(61,123,240,.10);font-size:11px;color:#1E4FB8;padding:1px 4px;overflow:hidden;white-space:nowrap}
.an.link{border:1.5px dashed #2E9E5B;background:rgba(46,158,91,.08)}
.an.fill{border:0;background:rgba(214,227,255,.55)}
.an.fill input,.an.fill select{width:100%;height:100%;border:1px solid #9DB5F0;background:rgba(255,255,255,.85);font:12px var(--font);padding:0 3px;color:#111}
.an.fill input,.an.fill select{min-height:0;box-sizing:border-box;display:block;line-height:1}.an.fill input[type=checkbox],.an.fill input[type=radio]{margin:0;width:100%;height:100%;accent-color:var(--accent)}
.an.stamp{border:3px solid currentColor;border-radius:8px;display:grid;place-items:center;font-weight:800;letter-spacing:.04em;opacity:.85;text-align:center;line-height:1.05}
.an svg{overflow:visible;position:absolute;inset:0;width:100%;height:100%}
.an img{width:100%;height:100%;display:block;pointer-events:none}
.textitem{position:absolute;border:1px dashed rgba(46,75,214,.6);border-radius:2px;cursor:text}
.cover{position:absolute;pointer-events:none}
.an.tb{white-space:pre;box-sizing:content-box}.an.tb .tl{position:absolute;overflow:visible}
.an[contenteditable="true"]{z-index:3}
.an.tb[contenteditable="true"]{outline:1.5px solid var(--accent);outline-offset:2px;cursor:text;z-index:3}
.ov.tool-edittext .an.tb,.ov.tool-edittext .an.edit{cursor:text}.ov.tool-edittext .an.tb:hover{outline:1px dashed var(--accent)}
.fp-btn{display:inline-flex;align-items:center;justify-content:space-between;gap:6px;min-width:150px;max-width:200px;border:1px solid var(--line);background:var(--chrome);border-radius:6px;padding:4px 8px;font-size:14px}
.fp-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fp-size{width:76px;border:1px solid var(--line);background:var(--chrome);border-radius:6px;padding:4px 6px}
.fp-pop{position:fixed;z-index:120;width:270px;max-height:min(420px,70vh);display:flex;flex-direction:column;background:var(--chrome);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.22);padding:8px}
.fp-pop input{border:1px solid var(--line);background:var(--chrome);color:var(--ink);border-radius:6px;padding:6px 8px;margin-bottom:6px}
.fp-list{overflow-y:auto}.fp-group{font-size:11.5px;font-weight:700;color:var(--ink-3);margin:8px 6px 2px}
.fp-item{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:6px;font-size:17px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fp-item:hover{background:var(--hover)}.fp-item.on{background:var(--accent-soft)}.fp-item small{font:12px var(--font);color:var(--ink-3)}
.textitem:hover{background:rgba(46,75,214,.08)}
.hit{position:absolute;background:rgba(242,176,30,.45);mix-blend-mode:multiply;pointer-events:none}
.hit.cur{background:rgba(255,120,0,.6)}
.drag-rect{position:absolute;border:1.5px dashed var(--accent);background:rgba(46,75,214,.08);pointer-events:none}
.crop-box{position:absolute;outline:2px dashed #0a9;box-shadow:0 0 0 9999px rgba(0,0,0,.28);pointer-events:none}
/* Right side pane */
.side-pane{width:280px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.thumbs{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0}
.thumb{position:relative;border:2px solid transparent;border-radius:4px;background:#fff;box-shadow:var(--paper-shadow);cursor:pointer}
.thumb.cur{border-color:var(--accent)}
.thumb canvas{display:block}
.thumb span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:11px;color:var(--ink-3)}
.clist{display:flex;flex-direction:column;gap:8px}
.citem{background:var(--chrome);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.citem.sel{border-color:var(--accent)}
.citem .meta{font-size:11.5px;color:var(--ink-3);display:flex;gap:6px;align-items:center}
.citem .dot{width:9px;height:9px;border-radius:50%}
.citem textarea{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:6px;padding:5px;background:var(--chrome);resize:vertical;min-height:44px}
.bm{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;cursor:pointer}
.bm:hover{background:var(--hover)}
.bm .icon-btn{margin-left:auto;width:26px;height:26px}
/* Start screen */
.start{position:absolute;inset:0;overflow:auto;background:var(--panel);z-index:5}
.start-in{max-width:980px;margin:0 auto;padding:44px 24px 80px}
.start h1{font-size:30px;line-height:1.15;margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
.start p.lead{color:var(--ink-2);margin:0 0 26px;font-size:15px;max-width:60ch}
.drop{border:2px dashed #AEB6C4;border-radius:14px;background:var(--chrome);padding:34px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .big{width:64px;height:78px;position:relative;flex:none}
.drop h2{margin:0 0 4px;font-size:18px}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:26px}
.quick button{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--chrome);border-radius:10px;padding:14px}
.quick button:hover{border-color:var(--accent)}
.quick b{display:block;margin-bottom:2px}
.quick small{color:var(--ink-3);line-height:1.35}
.quick .ti{color:var(--accent)}
/* Organize grid */
.org{position:absolute;inset:0;overflow:auto;background:var(--canvas);z-index:4;padding:20px}
.org-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px}
.oc{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:grab}
.oc .pg{background:#fff;box-shadow:var(--paper-shadow);border:3px solid transparent;border-radius:3px;position:relative}
.oc.sel .pg{border-color:var(--accent)}
.oc.dragover .pg{outline:3px solid var(--marker)}
.oc .pg canvas{display:block}
.oc .ops{display:flex;gap:2px;opacity:.9}
.oc .ops .icon-btn{width:28px;height:28px;background:var(--chrome)}
.oc span{font-size:12px;color:var(--ink-2)}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,14,22,.45);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:var(--chrome);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(560px,100%);max-height:90vh;display:flex;flex-direction:column}
.modal.wide{width:min(860px,100%)}
.modal header{display:flex;align-items:center;padding:16px 18px 6px;font-weight:700;font-size:17px}
.modal header .icon-btn{margin-left:auto}
.modal .mb{padding:4px 18px 10px;overflow:auto}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:10px}
.tabs button{border:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;font-weight:600;color:var(--ink-2)}
.tabs button.on{border-color:var(--accent);color:var(--ink)}
.sigpad{width:100%;height:180px;border:1px solid var(--line);border-radius:8px;background:#fff;touch-action:none;display:block}
.sig-choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sig-choices button{border:1px solid var(--line);background:#fff;color:#1a2a6c;border-radius:8px;padding:10px;font-size:26px;height:62px;overflow:hidden}
.sig-choices button.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.saved-sigs{display:flex;gap:8px;flex-wrap:wrap}
.saved-sigs button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px;height:54px;width:130px}
.saved-sigs img{max-width:100%;max-height:100%}
.filelist{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.fl{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--chrome)}
.fl span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl .icon-btn{width:28px;height:28px}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.diff{font-size:13px;line-height:1.55;white-space:pre-wrap;border:1px solid var(--line);border-radius:8px;padding:10px;max-height:52vh;overflow:auto;background:var(--panel)}
.diff ins{background:#CFF3D9;color:#0B4D24;text-decoration:none}
.diff del{background:#FAD2D2;color:#7A1111}
.ai-out{white-space:pre-wrap;line-height:1.5;background:var(--chrome);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:60px;font-size:13.5px}
.chat-msg{margin:8px 0;padding:8px 10px;border-radius:8px;line-height:1.45;white-space:pre-wrap;font-size:13.5px}
.chat-msg.u{background:var(--accent-soft)}
.chat-msg.a{background:var(--chrome);border:1px solid var(--line)}
.track{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--chrome);margin:6px 0;font-size:13px}
.track .st{font-weight:700}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;font-weight:700}
.pill.w{background:#FFF1CC;color:#7A5200}.pill.d{background:#D5F2DF;color:#0F5A2E}.pill.x{background:#FAD2D2;color:#7A1111}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--chrome);padding:10px 16px;border-radius:10px;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90vw;font-weight:500}
.busy{position:fixed;inset:0;background:rgba(10,14,22,.35);display:grid;place-items:center;z-index:150}
.busy div{background:var(--chrome);padding:18px 22px;border-radius:12px;display:flex;gap:12px;align-items:center;font-weight:600;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.spin{width:20px;height:20px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.hidden{display:none!important}
.a11y-list li{margin:6px 0}
.a11y-list .ok{color:var(--ok);font-weight:700}.a11y-list .bad{color:var(--danger);font-weight:700}

function htmlToBlocks(html){
  const d=new DOMParser().parseFromString(html,'text/html');d.querySelectorAll('script,style,noscript,template,svg,head').forEach(e=>e.remove());const out=[];
  const BLOCK=/^(H[1-6]|P|LI|PRE|TABLE|BLOCKQUOTE|DIV|SECTION|ARTICLE|UL|OL|HR|IMG|HEADER|FOOTER|MAIN|NAV|FIGURE|ASIDE|DL|DT|DD|FORM|FIELDSET|BR)$/;
  const txt=e=>e.textContent.replace(/\s+/g,' ').trim();
  const walk=(el,depth=0)=>{for(const n of el.childNodes){if(n.nodeType===3){const t=n.textContent.replace(/\s+/g,' ').trim();if(t)out.push({t:'p',text:t});continue}if(n.nodeType!==1)continue;const tg=n.tagName;
    if(/^H[1-6]$/.test(tg)){out.push({t:'h'+Math.min(4,+tg[1]),text:txt(n)});continue}
    if(tg==='HR'){out.push({t:'hr'});continue}
    if(tg==='IMG'){if(/^data:image\/(png|jpe?g)/.test(n.getAttribute('src')||''))out.push({t:'img',src:n.getAttribute('src')});continue}
    if(tg==='PRE'){n.textContent.split('\n').forEach(l=>out.push({t:'pre',text:l}));continue}
    if(tg==='TABLE'){const rows=[...n.querySelectorAll('tr')].map(tr=>[...tr.children].map(c=>txt(c)));out.push({t:'table',rows,header:!!n.querySelector('th')});continue}
    if(tg==='UL'||tg==='OL'){let k=1;for(const li of n.children){if(li.tagName!=='LI')continue;const nested=[...li.children].filter(c=>c.tagName==='UL'||c.tagName==='OL');nested.forEach(x=>x.remove());out.push({t:'li',text:txt(li),num:tg==='OL'?k++:0,depth});nested.forEach(x=>walk({childNodes:[x]},depth+1))}continue}
    if(tg==='BLOCKQUOTE'){out.push({t:'quote',text:txt(n)});continue}
    const hasBlock=[...n.children].some(c=>BLOCK.test(c.tagName));
    if(hasBlock)walk(n,depth);else{const t=txt(n);if(t)out.push({t:'p',text:t,bold:/^(B|STRONG|DT)$/.test(tg)})}
  }};
  walk(d.body);return out;
}

let tessWorker=null;
async function getTess(lang){
  if(tessWorker&&tessWorker.lang===lang)return tessWorker.w;
  await LIB.tesseract();const w=await Promise.race([Tesseract.createWorker(lang,1,{workerPath:'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',corePath:'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1',langPath:`https://cdn.jsdelivr.net/npm/@tesseract.js-data/${lang}@1.0.0/4.0.0_best_int`}),new Promise((_,rej)=>setTimeout(()=>rej(new Error('OCR engine timed out')),30000))]);
  tessWorker={w,lang};return w;
}
async function ocrPages(list,{lang='eng',force=false,onStep}={}){
  let engine=null,done=0,skipped=0;
  for(const p of list){
    const t=await textOf(p);if(!force&&t.items.filter(i=>!i.ocr).length>5){skipped++;continue}
    onStep?.(`Recognizing page ${S.pages.indexOf(p)+1}…`);
    const {pg,vp}=await vpOf(p,2);const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:ctx,viewport:vp}).promise;
    let words=null;
    if(engine!=='ai'){try{const w=await getTess(lang);const r=await w.recognize(c);words=(r.data.words||(r.data.blocks||[]).flatMap(b=>(b.paragraphs||[]).flatMap(p=>(p.lines||[]).flatMap(l=>l.words||[])))).filter(x=>x.text.trim()&&x.confidence>30).map(x=>({str:x.text,x:x.bbox.x0/2,y:x.bbox.y0/2,w:(x.bbox.x1-x.bbox.x0)/2,h:(x.bbox.y1-x.bbox.y0)/2,size:(x.bbox.y1-x.bbox.y0)/2}));engine='tess'}catch(e){console.warn('tesseract',e);engine='ai'}}
    if(!words&&RT.sample&&RT.imgOK){
      onStep?.(`Reading page ${S.pages.indexOf(p)+1} with AI vision…`);
      const blob=await new Promise(r=>c.toBlob(r,'image/png'));
      const res=await RT.sample.json(`This image is one scanned page. Transcribe ALL of its text as lines, in reading order. For each line give its position as fractions of the page size (0 to 1): left, top, right, bottom. Respond ONLY with JSON: {"lines":[{"text":"...","left":0.1,"top":0.05,"right":0.9,"bottom":0.07}]}`,{images:blob,modelTier:'default'});
      words=(res.lines||[]).filter(l=>l.text).map(l=>{const x=l.left*p.w,y=l.top*p.h,w=Math.max(10,(l.right-l.left)*p.w),hh=Math.max(6,(l.bottom-l.top)*p.h);return{str:l.text,x,y,w,h:hh,size:hh*.85}});
    }
    if(!words)throw new Error('The OCR engine couldn’t load in this view, and AI vision isn’t available here.');
    p.ocr=words;p.text=null;done++;
  }
  return{done,skipped,engine};
}
/* ============ Compress / optimize ============ */
async function compressPdf({maxPx=1600,quality=.7,rasterize=false,dpi=110}={},onStep){
  let bytes=await buildPdf();const before=bytes.length;
  if(rasterize){const tmp=await pdfjsLib.getDocument({data:bytes.slice()}).promise;const d=await PDFDocument.create();for(let i=1;i<=tmp.numPages;i++){onStep?.(`Flattening page ${i}…`);const pg=await tmp.getPage(i);const vp=pg.getViewport({scale:dpi/72});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:ctx,viewport:vp}).promise;const im=await d.embedJpg(Uint8Array.from(atob(c.toDataURL('image/jpeg',quality).split(',')[1]),x=>x.charCodeAt(0)));const v1=pg.getViewport({scale:1});d.addPage([v1.width,v1.height]).drawImage(im,{x:0,y:0,width:v1.width,height:v1.height})}bytes=await d.save({useObjectStreams:true});return{bytes,before,after:bytes.length,images:tmp.numPages}}
  const doc=await PDFDocument.load(bytes,{updateMetadata:false});const ctx=doc.context;let changed=0;
  const DCT=PDFName.of('DCTDecode');
  for(const[ref,obj]of ctx.enumerateIndirectObjects()){
    if(!(obj instanceof PDFLib.PDFRawStream))continue;const dct=obj.dict;
    if(dct.get(PDFName.of('Subtype'))!==PDFName.of('Image'))continue;
    let f=dct.get(PDFName.of('Filter'));if(f instanceof PDFArray){if(f.size()!==1)continue;f=f.get(0)}if(f!==DCT)continue;
    const cs=dct.get(PDFName.of('ColorSpace'));if(cs===PDFName.of('DeviceCMYK')||cs instanceof PDFArray&&cs.get(0)===PDFName.of('Indexed'))continue;if(dct.get(PDFName.of('Decode')))continue;
    try{onStep?.(`Downsampling image ${changed+1}…`);const bmp=await createImageBitmap(new Blob([obj.contents],{type:'image/jpeg'}));const k=Math.min(1,maxPx/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(bmp.width*k));c.height=Math.max(1,Math.round(bmp.height*k));const gray=cs===PDFName.of('DeviceGray');const cx=c.getContext('2d');cx.drawImage(bmp,0,0,c.width,c.height);
      const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',quality));const nb=new Uint8Array(await blob.arrayBuffer());if(nb.length>=obj.contents.length*.95)continue;
      const nd=ctx.obj({Type:'XObject',Subtype:'Image',Width:c.width,Height:c.height,ColorSpace:'DeviceRGB',BitsPerComponent:8,Filter:'DCTDecode'});const sm=dct.get(PDFName.of('SMask'));if(sm)nd.set(PDFName.of('SMask'),sm);nd.set(PDFName.of('Length'),PDFLib.PDFNumber.of(nb.length));ctx.assign(ref,PDFLib.PDFRawStream.of(nd,nb));changed++}catch(e){}
  }
  const out=await doc.save({useObjectStreams:true});return{bytes:out,before,after:out.length,images:changed};
}

/* ============ Password protection (RC4-128, PDF standard security handler R3) ============ */
const MD5K=new Int32Array(64).map((_,i)=>Math.floor(Math.abs(Math.sin(i+1))*4294967296)|0);
const MD5R=[7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];
function md5(m){const len=m.length,nb=((len+8)>>6)+1,w=new Int32Array(nb*16);for(let i=0;i<len;i++)w[i>>2]|=m[i]<<((i%4)*8);w[len>>2]|=0x80<<((len%4)*8);w[nb*16-2]=len*8;let a0=0x67452301,b0=0xefcdab89|0,c0=0x98badcfe|0,d0=0x10325476;
  for(let b=0;b<nb;b++){let A=a0,B=b0,C=c0,D=d0;for(let i=0;i<64;i++){let F,g;if(i<16){F=(B&C)|(~B&D);g=i}else if(i<32){F=(D&B)|(~D&C);g=(5*i+1)%16}else if(i<48){F=B^C^D;g=(3*i+5)%16}else{F=C^(B|~D);g=(7*i)%16}F=(F+A+MD5K[i]+w[b*16+g])|0;A=D;D=C;C=B;B=(B+((F<<MD5R[i])|(F>>>(32-MD5R[i]))))|0}a0=(a0+A)|0;b0=(b0+B)|0;c0=(c0+C)|0;d0=(d0+D)|0}
  const o=new Uint8Array(16);[a0,b0,c0,d0].forEach((v,i)=>{for(let k=0;k<4;k++)o[i*4+k]=(v>>>(k*8))&255});return o}
function rc4(key,data){const s=new Uint8Array(256);for(let i=0;i<256;i++)s[i]=i;let j=0;for(let i=0;i<256;i++){j=(j+s[i]+key[i%key.length])&255;[s[i],s[j]]=[s[j],s[i]]}const o=new Uint8Array(data.length);let i=0;j=0;for(let k=0;k<data.length;k++){i=(i+1)&255;j=(j+s[i])&255;[s[i],s[j]]=[s[j],s[i]];o[k]=data[k]^s[(s[i]+s[j])&255]}return o}
const PAD=new Uint8Array([0x28,0xBF,0x4E,0x5E,0x4E,0x75,0x8A,0x41,0x64,0x00,0x4E,0x56,0xFF,0xFA,0x01,0x08,0x2E,0x2E,0x00,0xB6,0xD0,0x68,0x3E,0x80,0x2F,0x0C,0xA9,0xFE,0x64,0x53,0x69,0x7A]);
const cat=(...a)=>{const o=new Uint8Array(a.reduce((s,x)=>s+x.length,0));let k=0;for(const x of a){o.set(x,k);k+=x.length}return o};
function padPw(pw){const b=new Uint8Array([...pw].map(c=>c.charCodeAt(0)&255).slice(0,32));return cat(b,PAD.slice(0,32-b.length))}
const toHex=b=>[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
async function encryptPdf(bytes,{user='',owner='',perms={}}){
  const doc=await PDFDocument.load(bytes,{updateMetadata:false});const ctx=doc.context;
  let P=0xFFFFF0C0;if(perms.print!==false)P|=4|2048;if(perms.modify!==false)P|=8;if(perms.copy!==false)P|=16|512;if(perms.annot!==false)P|=32;if(perms.forms!==false)P|=256;if(perms.assemble!==false)P|=1024;P=P|0;

  const Pb=new Uint8Array([P&255,(P>>8)&255,(P>>16)&255,(P>>>24)&255]);let k=md5(cat(padPw(user),O,Pb,id));for(let i=0;i<50;i++)k=md5(k.slice(0,16));const key=k.slice(0,16);
  let U=rc4(key,md5(cat(PAD,id)));for(let i=1;i<=19;i++)U=rc4(key.map(b=>b^i),U);U=cat(U,new Uint8Array(16));
  const objKey=(n,g)=>md5(cat(key,new Uint8Array([n&255,(n>>8)&255,(n>>16)&255,g&255,(g>>8)&255]))).slice(0,16);
  const encStr=(v,ok)=>{if(v instanceof PDFString||v instanceof PDFHexString){return PDFHexString.of(toHex(rc4(ok,v.asBytes())))}if(v instanceof PDFDict){for(const[kk,vv]of v.entries())v.set(kk,encStr(vv,ok));return v}if(v instanceof PDFArray){for(let i=0;i<v.size();i++)v.set(i,encStr(v.get(i),ok));return v}return v};
  for(const[ref,obj]of ctx.enumerateIndirectObjects()){const ok=objKey(ref.objectNumber,ref.generationNumber);
    if(obj instanceof PDFLib.PDFRawStream){const t=obj.dict.get(PDFName.of('Type'));if(t===PDFName.of('XRef')||t===PDFName.of('ObjStm'))continue;encStr(obj.dict,ok);ctx.assign(ref,PDFLib.PDFRawStream.of(obj.dict,rc4(ok,obj.contents)))}
    else if(obj instanceof PDFString||obj instanceof PDFHexString)ctx.assign(ref,encStr(obj,ok));else encStr(obj,ok)}

}

/* ============ Compare ============ */
function diffWords(a,b){const A=a.split(/(\s+)/).filter(Boolean),B=b.split(/(\s+)/).filter(Boolean);const n=A.length,m=B.length;if(n*m>6e6)return[{t:'=',s:'(Page too long to compare word by word.)'}];
  const dp=new Uint16Array((n+1)*(m+1));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i*(m+1)+j]=A[i]===B[j]?dp[(i+1)*(m+1)+j+1]+1:Math.max(dp[(i+1)*(m+1)+j],dp[i*(m+1)+j+1]);
  const out=[];let i=0,j=0;const push=(t,s)=>{const l=out[out.length-1];if(l&&l.t===t)l.s+=s;else out.push({t,s})};while(i<n&&j<m){if(A[i]===B[j]){push('=',A[i]);i++;j++}else if(dp[(i+1)*(m+1)+j]>=dp[i*(m+1)+j+1]){push('-',A[i]);i++}else{push('+',B[j]);j++}}while(i<n)push('-',A[i++]);while(j<m)push('+',B[j++]);return out}

/* ============ Accessibility check ============ */
async function a11yCheck(){const r=[];const txt=await docText();const imgOnly=txt.filter(t=>!t.trim()).length;
  r.push([!!(S.meta.title||S.title),'Title','Document has a title set in its properties']);
  r.push([true,'Language','Primary language will be saved as '+(S.meta.lang||'en-US')]);
  r.push([imgOnly===0,'Text content',imgOnly?`${imgOnly} page(s) have no real text. Run Scan & OCR so screen readers can read them.`:'Every page contains real text']);
  r.push([S.pages.length<21||S.bookmarks.length>0,'Bookmarks',S.pages.length>20&&!S.bookmarks.length?'Long document with no bookmarks — add some for navigation':'Navigation is adequate']);
  const fields=S.pages.flatMap(p=>p.annots.filter(a=>a.kind==='field'));const noTip=fields.filter(f=>!f.tooltip).length;r.push([noTip===0,'Form field descriptions',noTip?`${noTip} form field(s) lack a tooltip (screen readers announce it)`:'All form fields are described']);
  const imgs=S.pages.flatMap(p=>p.annots.filter(a=>a.kind==='image'||a.kind==='sign'));r.push([imgs.every(a=>a.alt),'Alternate text',imgs.length?`${imgs.filter(a=>!a.alt).length} added image(s) without alternate text — select one and set it in the options bar`:'No added images need alternate text']);
  const lum=hx=>{const c=hexToRgb(hx||'#000000').map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*c[0]+.7152*c[1]+.0722*c[2]};const low=S.pages.flatMap(p=>p.annots.filter(a=>a.kind==='txt'&&(1.05)/(lum(a.color)+.05)<4.5)).length;r.push([low===0,'Color contrast',low?`${low} text box(es) use a very light color`:'Added text has sufficient contrast']);
  r.push([!S.meta.redacted||true,'Tagged PDF','Tags are not generated by this editor; the reading order follows the page content order']);
  return r}

  const p=S.pages[S.cur];if(!p)return;const t=(await textOf(p)).plain;if(!t.trim())return toast('No readable text on this page — try Scan & OCR');const u=new SpeechSynthesisUtterance(t);u.onend=()=>{speaking=false;$('#railRead').setAttribute('aria-pressed','false')};speaking=true;$('#railRead').setAttribute('aria-pressed','true');speechSynthesis.speak(u);toast('Reading page '+(S.cur+1)+' — click again to stop')}

/* ============ Search ============ */
async function runSearch(q,{caseSens=false,whole=false}={}){SR.q=q;SR.hits=[];SR.i=0;if(!q){redrawAll();return 0}
  const flags=caseSens?'g':'gi';let src=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');if(whole)src='\\b'+src+'\\b';const re=new RegExp(src,flags);
  for(const p of S.pages){const t=await textOf(p);for(const l of t.lines){re.lastIndex=0;let m;while((m=re.exec(l.str))){SR.hits.push({page:p.id,...spanRect(l,m.index,m[0].length)});if(!m[0].length)break}}}
  redrawAll();if(SR.hits.length)goHit(0);return SR.hits.length}
function goHit(i){if(!SR.hits.length)return;SR.i=(i+SR.hits.length)%SR.hits.length;const hit=SR.hits[SR.i];const p=S.pages.find(q=>q.id===hit.page);redrawAll();const el=pageEl(p);$('#viewer').scrollTo({top:el.offsetTop+hit.y*S.zoom-140,behavior:'smooth'});const c=$('#srCount');if(c)c.textContent=`${SR.i+1} of ${SR.hits.length}`}
/* ============ Modal ============ */
function modal({title,body,buttons=[],wide=false,onClose}){
  const bg=h('div',{class:'modal-bg'});const m=h('div',{class:'modal'+(wide?' wide':''),role:'dialog','aria-modal':'true','aria-label':title});
  m.innerHTML=`<header>${esc(title)}<button class="icon-btn" data-x title="Close">${icon('close')}</button></header><div class="mb"></div>`;
  const mb=m.querySelector('.mb');if(typeof body==='string')mb.innerHTML=body;else if(body)mb.appendChild(body);
  const close=()=>{bg.remove();onClose?.()};
  if(buttons.length){const f=h('footer');for(const b of buttons){const bt=h('button',{class:'btn'+(b.primary?' primary':'')+(b.danger?' danger':'')},esc(b.label));bt.onclick=async()=>{const r=await b.onClick?.(mb,close);if(r!==false&&!b.keep)close()};f.appendChild(bt)}m.appendChild(f)}
  m.querySelector('[data-x]').onclick=close;bg.onclick=e=>{if(e.target===bg)close()};bg.addEventListener('keydown',e=>{if(e.key==='Escape')close();e.stopPropagation()});
  bg.appendChild(m);document.body.appendChild(bg);setTimeout(()=>m.querySelector('input,select,textarea,button:not([data-x])')?.focus(),30);return{mb,close,el:m};
}

function rotatePages(list,deg){if(!list.length)return;pushHist();for(const p of list){if(!p)continue;p.rot=((p.rot+deg)%360+360)%360;const nw=p.h,nh=p.w;

async function convertAndOpen(files,{ocr=false,append=false}={}){
  busy('Converting…');
  try{
    const parts=[];for(const f of files)parts.push({bytes:await fileToPdfBytes(f,busy),name:f.name});
    if(!append||!S.pages.length){await openBytes(parts[0].bytes,parts[0].name);for(const p of parts.slice(1))await appendBytes(p.bytes,p.name);if(parts.length>1){S.title=files.length>1?'Combined':S.title;$('#docTitle').value=S.title}await renderAll()}
    else{pushHist();for(const p of parts)await appendBytes(p.bytes,p.name);await renderAll()}
    busy();
    if(ocr){await runOcr(S.pages.slice(-parts.length))}else toast(files.length>1?`${files.length} files converted and combined`:'Converted to PDF — save to keep it');
  }catch(e){busy();console.error(e);toast('Conversion failed: '+e.message,5000)}
}

}
function trackDialog(){const body=h('div');const draw=()=>{body.innerHTML=S.sendJobs.length?'':'<p class="hint">No agreements sent yet.</p>';S.sendJobs.slice().reverse().forEach(j=>{const done=j.recipients.every(r=>r.status==='signed');const d=h('div',{class:'track'},`<div class="row"><b>${esc(j.title)}</b><span class="pill ${done?'d':'w'}">${done?'Completed':'Out for signature'}</span><span class="hint" style="margin-left:auto">${new Date(j.created).toLocaleString()}</span></div>${j.recipients.map((r,i)=>`<div class="row" style="margin:4px 0">${r.order}. ${esc(r.name||r.email)} <span class="hint">${esc(r.email)}</span> <span class="pill ${r.status==='signed'?'d':r.status==='declined'?'x':'w'}">${r.status}</span>${r.status==='waiting'?`<button class="btn sm" data-j="${j.id}" data-r="${i}" data-s="signed">Mark signed</button><button class="btn sm" data-j="${j.id}" data-r="${i}" data-s="declined">Declined</button>`:''}</div>`).join('')}<details><summary class="hint">Audit trail</summary>${j.log.map(l=>`<div class="hint">${new Date(l.t).toLocaleString()} — ${esc(l.e)}</div>`).join('')}</details><div class="row" style="margin-top:6px"><button class="btn sm" data-verify="${j.id}">Check a returned copy…</button><button class="btn sm" data-del="${j.id}">Remove</button></div>`);body.appendChild(d)});
  body.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const j=S.sendJobs.find(x=>x.id===b.dataset.j);const r=j.recipients[+b.dataset.r];r.status=b.dataset.s;j.log.push({t:new Date().toISOString(),e:`${r.name||r.email} ${r.status}`});persist();draw()});

  body.querySelectorAll('[data-verify]').forEach(b=>b.onclick=async()=>{const fs=await pickFiles({accept:'.pdf'});if(!fs[0])return;const j=S.sendJobs.find(x=>x.id===b.dataset.verify);const by=await readFile(fs[0]);const hsh=await sha256(by);let filled=0;try{const f=(await PDFDocument.load(by,{ignoreEncryption:true})).getForm();f.getFields().forEach(x=>{try{if(x.getText?.())filled++}catch(e){}})}catch(e){}j.log.push({t:new Date().toISOString(),e:hsh===j.hash?'Returned copy is identical to what was sent (not yet signed)':`Returned copy received (${filled} field(s) filled, fingerprint ${hsh.slice(0,12)}…)`});persist();draw();toast(hsh===j.hash?'This copy is unchanged from the one sent':'Changes detected — recorded in the audit trail')})};draw();

async function sampleDoc(){busy('Building sample…');const d=await PDFDocument.create();const f=await d.embedFont(StandardFonts.Helvetica),fb=await d.embedFont(StandardFonts.HelveticaBold),ft=await d.embedFont(StandardFonts.TimesRoman);const form=d.getForm();const ink=rgb(.1,.13,.2),acc=rgb(.18,.29,.84);

  let y=630;const para=(t,sz=11,font=ft)=>{for(const ln of wrapText(t,font,sz,504)){p.drawText(ln,{x:54,y,size:sz,font,color:ink});y-=sz*1.45}y-=8};

  p.drawText('2. Client details',{x:54,y,size:13,font:fb,color:ink});y-=26;
  const tf=(name,label,yy)=>{p.drawText(label,{x:54,y:yy+5,size:10,font:f,color:ink});const t=form.createTextField(name);t.addToPage(p,{x:170,y:yy,width:300,height:18,borderColor:rgb(.6,.65,.75),borderWidth:.8})};
  tf('client.name','Client name',y);y-=28;tf('client.company','Company',y);y-=28;tf('client.email','Email',y);y-=32;
  const cb=form.createCheckBox('agree.terms');cb.addToPage(p,{x:54,y,width:13,height:13,borderColor:rgb(.4,.45,.55),borderWidth:1});p.drawText('I have read and agree to the terms on page 2.',{x:74,y:y+2,size:10,font:f,color:ink});
  const p2=d.addPage([612,792]);y=730;const para2=(t,sz=11,font=ft)=>{for(const ln of wrapText(t,font,sz,504)){p2.drawText(ln,{x:54,y,size:sz,font,color:ink});y-=sz*1.45}y-=8};
  p2.drawText('3. Terms',{x:54,y,size:13,font:fb,color:ink});y-=22;para2('Either party may end this agreement with 14 days written notice. Work completed up to that date will be invoiced pro rata. All final artwork becomes the property of the Client once both instalments are paid.');para2('The Provider may show the work in its portfolio unless the Client objects in writing. Confidential information shared by either party will not be disclosed to third parties.');
  y-=30;p2.drawText('Client signature: ______________________________   Date: ____________',{x:54,y,size:11,font:f,color:ink});y-=50;p2.drawText('Provider signature: ____________________________   Date: ____________',{x:54,y,size:11,font:f,color:ink});
  d.setTitle('Service Agreement');d.setAuthor('Northwind Studio');const b=await d.save();busy();await openBytes(b,'Service Agreement.pdf');}

/* ============ Start screen ============ */
function renderStart(){const s=$('#start');s.innerHTML=`<div class="start-in"><h1>Edit, convert, sign and protect PDFs</h1><p class="lead">Everything runs in your browser. Drop a file to start, or pick a tool.</p>
  <div class="drop" id="drop"><svg class="big" viewBox="0 0 64 78" aria-hidden="true"><path d="M4 2h38l18 18v56H4z" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2.5"/><path d="M42 2v18h18" fill="none" stroke="var(--accent)" stroke-width="2.5"/><path d="M32 58V34M22 44l10-10 10 10" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div style="flex:1;min-width:220px"><h2>Drop files here</h2><p class="hint" style="margin:0 0 12px">PDF, Word, Excel, PowerPoint, images, HTML or text. Several files are combined.</p><div class="row"><button class="btn primary" id="stOpen">${icon('upload')} Select a file</button><button class="btn" id="stBlank">${icon('page')} Blank PDF</button><button class="btn" id="stSample">${icon('sparkle')} Try a sample agreement</button></div></div></div>
  <div class="quick">${[['edit','edit','Edit a PDF','Change text and images'],['create','create','Create a PDF','From Office files and images'],['combine','combine','Combine files','Merge into one PDF'],['export','export','Export a PDF','To Word, Excel, PowerPoint'],['fillsign','sign','Fill & Sign','Complete and sign forms'],['ocr','ocr','Scan & OCR','Make scans searchable'],['protect','protect','Protect a PDF','Add a password'],['compress','compress','Compress a PDF','Reduce file size']].map(([k,ic,t,sub])=>`<button data-q="${k}"><span class="ti">${icon(ic,26)}</span><span><b>${t}</b><small>${sub}</small></span></button>`).join('')}</div></div>`;
  $('#stOpen').onclick=openFile;$('#stBlank').onclick=blankDoc;$('#stSample').onclick=sampleDoc;
  s.querySelectorAll('[data-q]').forEach(b=>b.onclick=async()=>{const k=b.dataset.q;if(k==='combine')return combineDialog();if(k==='create'){openPane('create');const fs=await pickFiles({multiple:true});if(fs.length)convertAndOpen(fs);return}if(k==='ocr'){openPane('ocr');const fs=await pickFiles({multiple:true});if(fs.length)convertAndOpen(fs,{ocr:true});return}const fs=await pickFiles({accept:'.pdf'});if(!fs[0])return;await openPdfFile(fs[0]);openPane(k);if(k==='edit')setTool('edittext');if(k==='fillsign')setTool('filltext')});
  const dz=$('#drop');dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};dz.ondragleave=()=>dz.classList.remove('over')}

/* ============ Global events ============ */
window.addEventListener('dragover',e=>{if(e.dataTransfer?.types?.includes('Files'))e.preventDefault()});
window.addEventListener('drop',e=>{const fs=[...(e.dataTransfer?.files||[])];if(!fs.length)return;e.preventDefault();$('#drop')?.classList.remove('over');if(!S.pages.length){if(fs.length===1&&extOf(fs[0].name)==='pdf')openPdfFile(fs[0]);else convertAndOpen(fs)}else{const ov=e.target.closest?.('.ov');if(ov&&fs.length===1&&fs[0].type.startsWith('image/')){const p=pageOfOv(ov);const[x,y]=ptIn(ov,e);imageToPngURL(fs[0]).then(async src=>{const im=await loadImg(src);const w=Math.min(im.width*.75,p.w*.5);addAnnot(p,{kind:'image',x,y,w,h:w*im.height/im.width,src})});return}convertAndOpen(fs,{append:true});toast('Adding files to the end of this document…')}});
document.addEventListener('paste',async e=>{if(!S.pages.length||e.target.closest?.('input,textarea,[contenteditable="true"]'))return;const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));if(!it)return;e.preventDefault();const src=await imageToPngURL(it.getAsFile());const im=await loadImg(src);const p=S.pages[S.cur];const w=Math.min(im.width*.75,p.w*.6);addAnnot(p,{kind:'image',x:(p.w-w)/2,y:p.h*.2,w,h:w*im.height/im.width,src})});
document.addEventListener('keydown',e=>{
  if(e.target.closest?.('input,textarea,select,[contenteditable="true"]'))return;const c=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
  if(c&&k==='s'){e.preventDefault();savePdf()}else if(c&&k==='o'){e.preventDefault();openFile()}else if(c&&k==='p'){e.preventDefault();printDoc()}else if(c&&k==='z'&&!e.shiftKey){e.preventDefault();undo()}else if(c&&(k==='y'||(k==='z'&&e.shiftKey))){e.preventDefault();redo()}
  else if(c&&k==='f'){e.preventDefault();openFind()}else if(c&&k==='d'){e.preventDefault();duplicateSel()}else if(c&&(k==='='||k==='+')){e.preventDefault();setZoom(S.zoom*1.2)}else if(c&&k==='-'){e.preventDefault();setZoom(S.zoom/1.2)}else if(c&&k==='0'){e.preventDefault();setZoom(1)}else if(c&&k==='l'){e.preventDefault();toggleReading()}
  else if(c)return;
  else if((k==='delete'||k==='backspace')&&S.sel){e.preventDefault();deleteSel()}
  else if(k==='escape'){if(document.body.classList.contains('reading'))toggleReading();else{closeMenu();setTool('select')}}
  else if(S.sel&&k.startsWith('arrow')){e.preventDefault();const f=findAnnot(S.sel);const d=e.shiftKey?10:1;const[dx,dy]={arrowleft:[-d,0],arrowright:[d,0],arrowup:[0,-d],arrowdown:[0,d]}[k];if(!e.repeat)pushHist();setBox(f.a,f.a.x+dx,f.a.y+dy,f.a.w,f.a.h);drawOverlay(f.p);select(f.a.id)}
  else if(!S.pages.length)return;
  else if(k==='pagedown'||k==='arrowright'&&!S.sel){goPage(S.cur+1)}else if(k==='pageup'){goPage(S.cur-1)}
  else{const m={v:'select',h:'hand',t:'addtext',e:'edittext',n:'note',u:'highlight',d:'draw'}[k];if(m)setTool(m);else if(k==='?')shortcutsDialog()}
});
window.addEventListener('beforeunload',e=>{if(S.dirty){e.preventDefault();e.returnValue=''}});

/* ============ Wire-up ============ */
const rs=document.createElement('style');rs.textContent='body.reading .top,body.reading .optbar,body.reading .rail,body.reading .tools-pane,body.reading .side-pane{display:none!important}body.reading .main{grid-template-columns:1fr}';document.head.appendChild(rs);
$('#btnSave').onclick=savePdf;$('#btnPrint').onclick=printDoc;$('#btnSearch').onclick=openFind;$('#btnTheme').onclick=toggleTheme;$('#btnAI').onclick=()=>openPane('ai');
$('#paneBack').onclick=()=>{$('#org').classList.add('hidden');openPane(null)};$('#paneClose').onclick=()=>{$('#toolsPane').hidden=true;$('#org').classList.add('hidden')};$('#sideClose').onclick=closeSide;
$$('[data-side]').forEach(b=>b.onclick=()=>{if(sideMode===b.dataset.side&&!$('#sidePane').hidden)closeSide();else openSide(b.dataset.side)});

$('#prevPg').onclick=()=>goPage(S.cur-1);$('#nextPg').onclick=()=>goPage(S.cur+1);$('#pgInput').onchange=e=>goPage((parseInt(e.target.value,10)||1)-1);

$('#zVal').onclick=()=>{const d=$('#menuDrop');d.innerHTML='';[[.5,'50%'],[.75,'75%'],[1,'100%'],[1.25,'125%'],[1.5,'150%'],[2,'200%'],[3,'300%'],['w','Fit width'],['p','Fit page']].forEach(([v,l])=>{const b=h('button',{},l);b.onclick=()=>{closeMenu();v==='w'?fitWidth():v==='p'?fitPage():setZoom(v)};d.appendChild(b)});const r=$('#zVal').getBoundingClientRect();d.style.position='fixed';d.style.left=r.left-60+'px';d.style.top=r.top-330+'px';d.style.minWidth='140px';d.classList.remove('hidden');openMenuName='zoom'};
$('#docTitle').onchange=e=>{S.title=e.target.value.trim()||'document';S.meta.title=S.title};
$('#viewer').addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();setZoom(S.zoom*(e.deltaY<0?1.1:1/1.1))}},{passive:false});
let rsT;window.addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(()=>{if(S.pages.length&&S.zoom<.3)fitWidth()},200)});
hydrateIcons();renderQuickRail();renderOptbar();renderStart();openPane(null);
if(matchMedia('(max-width:900px)').matches)$('#toolsPane').hidden=true;
